<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020a10" />
  <title>LEGAVIA — Career Island</title>
  <link rel="preload" as="image" href="./assets/screens/island-career.webp?v=20261005.2" />
  <link rel="stylesheet" href="./image-ui.css" />
</head>
<body>
  <main class="screen-shell" aria-label="LEGAVIA Career Island Goals">
    <img class="screen-img" src="./assets/screens/island-career.webp?v=20261005.2" alt="Career Island goals dashboard with long, mid and short term goals" />

    <a class="hit island-back" href="./goals-map"><span class="hit-label">Back to World Map</span></a>

    <button class="hit island-tab-goals" type="button" data-tab="goals"><span class="hit-label">Goals and Tasks</span></button>
    <button class="hit island-tab-overview" type="button" data-tab="overview"><span class="hit-label">Overview</span></button>
    <button class="hit island-tab-notes" type="button" data-tab="notes"><span class="hit-label">Notes</span></button>
    <button class="hit island-tab-resources" type="button" data-tab="resources"><span class="hit-label">Resources</span></button>

    <button class="hit island-long-1" type="button" data-goal="c-l1"><span class="hit-label">Become a Senior Developer</span></button>
    <button class="hit island-long-2" type="button" data-goal="c-l2"><span class="hit-label">Build Multiple Income Streams</span></button>
    <button class="hit island-long-3" type="button" data-goal="c-l3"><span class="hit-label">Work Remotely from Anywhere</span></button>
    <button class="hit island-mid-1" type="button" data-goal="c-m1"><span class="hit-label">Complete a Key Project</span></button>
    <button class="hit island-mid-2" type="button" data-goal="c-m2"><span class="hit-label">Improve Core Skills</span></button>
    <button class="hit island-mid-subtasks" type="button" data-focus-goal="c-m2"><span class="hit-label">Open Improve Core Skills in Focus</span></button>
    <button class="hit island-add-goal" type="button" data-add-goal="c-m2"><span class="hit-label">Add Task to Improve Core Skills</span></button>
    <button class="hit island-short-1" type="button" data-goal="c-s1"><span class="hit-label">Update Resume</span></button>
    <button class="hit island-short-2" type="button" data-goal="c-s2"><span class="hit-label">Apply to 3 Target Companies</span></button>
    <button class="hit island-short-3" type="button" data-goal="c-s3"><span class="hit-label">Dedicate 30 Min Daily to Learning</span></button>
    <button class="hit island-register" type="button" data-register><span class="hit-label">Register New Task</span></button>

    <a class="hit island-nav-home" href="./"><span class="hit-label">Home</span></a>
    <a class="hit island-nav-map" href="./goals-map"><span class="hit-label">World Map</span></a>
    <a class="hit island-nav-goals" href="./island?phase=career"><span class="hit-label">Goals</span></a>
    <a class="hit island-nav-focus" href="./focus"><span class="hit-label">Focus</span></a>
    <button class="hit island-nav-tasks" type="button" data-register><span class="hit-label">Tasks</span></button>
    <button class="hit island-nav-journal" type="button" data-tab="notes"><span class="hit-label">Journal</span></button>

    <dialog class="ui-sheet" id="taskDialog" aria-labelledby="taskTitleHeading">
      <div class="sheet-head"><div><p>CAREER ISLAND</p><h2 id="taskTitleHeading">Add Task to Goal</h2></div>
        <form method="dialog"><button class="sheet-close" value="close" aria-label="Close">×</button></form></div>
      <div class="sheet-body">
        <form class="sheet-form" id="taskForm">
          <label>Task title<input id="taskTitle" required maxlength="90" placeholder="Next actionable step" /></label>
          <label>Goal horizon<select id="taskHorizon"><option value="long">Long-term</option><option value="mid">Mid-term</option><option value="short">Short-term</option></select></label>
          <label>Goal<select id="taskGoal"></select></label>
          <label>Estimated focus<select id="taskFocus"><option value="25">25 min</option><option value="50">50 min</option><option value="90">90 min</option></select></label>
          <button class="sheet-cta" type="submit">＋ Add Task to This Goal</button>
        </form>
      </div>
    </dialog>

    <dialog class="ui-sheet" id="genericDialog" aria-labelledby="genericTitle">
      <div class="sheet-head"><div><p>CAREER ISLAND</p><h2 id="genericTitle">Details</h2></div>
        <form method="dialog"><button class="sheet-close" value="close" aria-label="Close">×</button></form></div>
      <div class="sheet-body" data-generic-body></div>
    </dialog>
  </main>
  <div class="toast" data-toast hidden></div>
  <script src="./geek-state.js"></script>
  <script src="./image-island.js"></script>
</body>
</html>
