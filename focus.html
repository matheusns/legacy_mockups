<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020a10" />
  <title>LEGACY — Focus Forest</title>
  <link rel="preload" as="image" href="./assets/screens/focus.webp" />
  <link rel="stylesheet" href="./image-ui.css" />
</head>
<body>
  <main class="screen-shell" aria-label="LEGACY Focus Forest">
    <img class="screen-img" src="./assets/screens/focus.webp" alt="LEGACY Focus Forest with Pomodoro timer, glowing tree, session stats and current task" />

    <button class="hit focus-search" type="button" data-search><span class="hit-label">Search</span></button>
    <button class="hit focus-settings" type="button" data-settings><span class="hit-label">Focus settings</span></button>
    <button class="hit focus-profile" type="button" data-profile><span class="hit-label">Explorer profile</span></button>

    <div class="focus-timer-overlay" data-timer aria-live="polite">25:00</div>

    <button class="hit focus-mode-pomodoro focus-mode-selected" type="button" data-mode="pomodoro" data-minutes="25"><span class="hit-label">Pomodoro 25 minutes</span></button>
    <button class="hit focus-mode-short" type="button" data-mode="short" data-minutes="5"><span class="hit-label">Short Break 5 minutes</span></button>
    <button class="hit focus-mode-long" type="button" data-mode="long" data-minutes="15"><span class="hit-label">Long Break 15 minutes</span></button>
    <button class="hit focus-mode-custom" type="button" data-mode="custom" data-minutes="50"><span class="hit-label">Deep Work 50 minutes</span></button>
    <button class="hit focus-start" type="button" data-start><span class="hit-label">Start or pause focus session</span></button>
    <button class="hit focus-reset" type="button" data-reset><span class="hit-label">Reset timer</span></button>

    <button class="hit focus-current-task" type="button" data-current-task><span class="hit-label">Open current task and choose task</span></button>
    <button class="hit focus-history" type="button" data-history><span class="hit-label">Open session history</span></button>
    <button class="hit focus-mark" type="button" data-mark><span class="hit-label">Mark current task progress after a completed focus session</span></button>

    <a class="hit focus-nav-home" href="./"><span class="hit-label">Home</span></a>
    <a class="hit focus-nav-map" href="./goals-map"><span class="hit-label">World Map</span></a>
    <a class="hit focus-nav-goals" href="./island?phase=career"><span class="hit-label">Goals</span></a>
    <a class="hit focus-nav-focus" href="./focus"><span class="hit-label">Focus</span></a>
    <button class="hit focus-nav-tasks" type="button" data-current-task><span class="hit-label">Tasks</span></button>
    <button class="hit focus-nav-journal" type="button" data-journal><span class="hit-label">Journal</span></button>

    <dialog class="ui-sheet" id="genericDialog" aria-labelledby="genericTitle">
      <div class="sheet-head">
        <div><p>FOCUS FOREST</p><h2 id="genericTitle">Details</h2></div>
        <form method="dialog"><button class="sheet-close" value="close" aria-label="Close">×</button></form>
      </div>
      <div class="sheet-body" data-generic-body></div>
    </dialog>
  </main>

  <div class="toast" data-toast hidden></div>
  <script src="./geek-state.js"></script>
  <script src="./image-focus.js"></script>
</body>
</html>
