<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020a10" />
  <title>LEGACY — World Map</title>
  <link rel="preload" as="image" href="./assets/screens/world-map.webp" />
  <link rel="stylesheet" href="./image-ui.css" />
</head>
<body>
  <main class="screen-shell map-shell" aria-label="LEGACY World Map">
    <img class="screen-img map-base" src="./assets/screens/world-map.webp" alt="LEGACY fantasy world map" />

    <a class="hit map-back" href="./"><span class="hit-label">Back to Home</span></a>

    <div class="map-crop" data-map-crop aria-label="Interactive map: drag to pan, wheel or pinch to zoom">
      <div class="map-transform" data-map-transform>
        <img class="screen-img" src="./assets/screens/world-map.webp" alt="" aria-hidden="true" />
        <button class="map-hit map-foundation" type="button" data-phase="foundation" aria-label="Foundation Island"></button>
        <button class="map-hit map-health" type="button" data-phase="health" aria-label="Health Island"></button>
        <button class="map-hit map-career" type="button" data-phase="career" aria-label="Career Island"></button>
        <button class="map-hit map-wealth" type="button" data-phase="wealth" aria-label="Wealth Island"></button>
        <button class="map-hit map-legacy" type="button" data-phase="legacy" aria-label="Legacy Island"></button>
      </div>
    </div>

    <button class="hit map-reset-view" type="button" data-reset-map><span class="hit-label">Reset map view</span></button>
    <button class="hit map-continue" type="button" data-continue><span class="hit-label">Continue in selected island</span></button>

    <a class="hit map-home-nav" href="./"><span class="hit-label">Home</span></a>
    <a class="hit map-map-nav" href="./goals-map"><span class="hit-label">World Map</span></a>
    <a class="hit map-goals-nav" href="./island?phase=career"><span class="hit-label">Goals</span></a>
    <a class="hit map-focus-nav" href="./focus"><span class="hit-label">Focus</span></a>
    <button class="hit map-tasks-nav" type="button" data-tasks><span class="hit-label">Tasks</span></button>
    <button class="hit map-journal-nav" type="button" data-journal><span class="hit-label">Journal</span></button>

    <div class="hotspot-feedback" data-map-feedback style="left:34%;bottom:22%">Foundation selected</div>

    <dialog class="ui-sheet" id="genericDialog" aria-labelledby="genericTitle">
      <div class="sheet-head"><div><p>WORLD MAP</p><h2 id="genericTitle">Island</h2></div>
        <form method="dialog"><button class="sheet-close" value="close" aria-label="Close">×</button></form></div>
      <div class="sheet-body" data-generic-body></div>
    </dialog>
  </main>
  <div class="toast" data-toast hidden></div>
  <script src="./geek-state.js"></script>
  <script src="./image-map.js"></script>
</body>
</html>
