<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03131d" />
  <title>LEGACY — World Map</title>
  <link rel="stylesheet" href="geek.css" />
</head>
<body data-page="map">
  <main class="world-shell">
    <div class="world-toolbar">
      <a href="./">‹ Back</a>
      <div class="world-title"><div style="color:#ffc85c;font-size:22px">♛</div><h1>World Map</h1><p>EXPLORE · GROW · BUILD A BRIGHTER TOMORROW</p></div>
      <button class="regions" type="button" data-fit>⚑ <span data-region-count>3 / 5</span> REGIONS</button>
    </div>
    <div class="map-help">Drag to explore · pinch/wheel to zoom · tap an island</div>
    <div class="map-viewport" data-viewport aria-label="Interactive world map">
      <div class="map-canvas" data-canvas>
        <span class="path-node p1"></span><span class="path-node p2"></span><span class="path-node p3"></span><span class="path-node p4"></span><span class="path-node p5"></span>
        <button class="island-hotspot island-foundation" type="button" data-phase="foundation"><span class="island-label"><strong>🌿 FOUNDATION</strong><small><span data-phase-pct="foundation">0</span>% COMPLETE</small></span></button>
        <button class="island-hotspot island-health" type="button" data-phase="health"><span class="island-label"><strong>❤️ HEALTH</strong><small><span data-phase-pct="health">0</span>% COMPLETE</small></span></button>
        <button class="island-hotspot island-career" type="button" data-phase="career"><span class="island-label"><strong>💼 CAREER</strong><small><span data-phase-pct="career">0</span>% COMPLETE</small></span></button>
        <button class="island-hotspot island-wealth" type="button" data-phase="wealth"><span class="island-label"><strong>🪙 WEALTH</strong><small><span data-phase-pct="wealth">0</span>% COMPLETE</small></span></button>
        <button class="island-hotspot island-legacy" type="button" data-phase="legacy"><span class="island-label"><strong>♛ LEGACY</strong><small><span data-phase-pct="legacy">0</span>% COMPLETE</small></span></button>
      </div>
    </div>

    <section class="map-card">
      <div class="map-card-main">
        <div class="map-thumb" data-map-icon>💼</div>
        <div><p class="pixel-kicker" data-map-theme>CITADEL</p><h2 data-map-title>Career</h2><p data-map-tagline>Build mastery and meaningful professional impact.</p></div>
        <div><strong><span data-map-pct>0</span>%</strong><p>COMPLETE</p></div>
      </div>
      <a class="neon-cta" data-continue href="./island?phase=career">▶ Continue in Career</a>
    </section>
  </main>
  <script src="geek-state.js"></script>
  <script src="world-map.js"></script>
</body>
</html>
