<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020a10" />
  <title>LEGACY — Home</title>
  <link rel="preload" as="image" href="./assets/screens/home.webp" />
  <link rel="stylesheet" href="./image-ui.css" />
</head>
<body>
  <main class="screen-shell" aria-label="LEGACY Home">
    <img class="screen-img" src="./assets/screens/home.webp" alt="LEGACY fantasy productivity dashboard" />

    <button class="hit home-search" type="button" data-search><span class="hit-label">Search</span></button>
    <button class="hit home-settings" type="button" data-settings><span class="hit-label">Settings</span></button>
    <button class="hit home-profile" type="button" data-profile><span class="hit-label">Profile</span></button>
    <button class="hit home-next" type="button" data-next><span class="hit-label">Open next best action</span></button>
    <button class="hit home-hydration" type="button" data-water><span class="hit-label">Log one glass of water</span></button>
    <a class="hit home-focus" href="./focus"><span class="hit-label">Open Focus Forest</span></a>
    <a class="hit home-focus-start" href="./focus"><span class="hit-label">Start focus session</span></a>
    <a class="hit home-map-open" href="./goals-map"><span class="hit-label">Open World Map</span></a>
    <button class="hit home-task-add" type="button" data-add-task><span class="hit-label">Register new task</span></button>

    <button class="hit home-task-1" type="button" data-task-row="0"><span class="hit-label">Toggle task one</span></button>
    <button class="hit home-task-2" type="button" data-task-row="1"><span class="hit-label">Toggle task two</span></button>
    <button class="hit home-task-3" type="button" data-task-row="2"><span class="hit-label">Toggle task three</span></button>
    <button class="hit home-task-4" type="button" data-task-row="3"><span class="hit-label">Toggle task four</span></button>
    <button class="hit home-task-5" type="button" data-task-row="4"><span class="hit-label">Toggle task five</span></button>

    <a class="hit nav-home" href="./"><span class="hit-label">Home</span></a>
    <a class="hit nav-map" href="./goals-map"><span class="hit-label">World Map</span></a>
    <a class="hit nav-goals" href="./island?phase=career"><span class="hit-label">Goals</span></a>
    <a class="hit nav-focus" href="./focus"><span class="hit-label">Focus</span></a>
    <button class="hit nav-tasks" type="button" data-add-task><span class="hit-label">Tasks</span></button>
    <button class="hit nav-journal" type="button" data-journal><span class="hit-label">Journal</span></button>

    <dialog class="ui-sheet" id="taskDialog" aria-labelledby="taskDialogTitle">
      <div class="sheet-head">
        <div><p>REGISTER QUEST</p><h2 id="taskDialogTitle">New Task</h2></div>
        <form method="dialog"><button class="sheet-close" value="close" aria-label="Close">×</button></form>
      </div>
      <div class="sheet-body">
        <form class="sheet-form" id="taskForm">
          <label>Task title<input id="taskTitle" required maxlength="90" placeholder="What moves the quest forward?" /></label>
          <label>Island<select id="taskPhase"></select></label>
          <label>Goal horizon<select id="taskHorizon"><option value="short">Short-term</option><option value="mid">Mid-term</option><option value="long">Long-term</option></select></label>
          <label>Goal<select id="taskGoal"></select></label>
          <label>Estimated focus<select id="taskFocus"><option value="25">25 min</option><option value="50">50 min</option><option value="90">90 min</option></select></label>
          <button class="sheet-cta" type="submit">＋ Register New Task</button>
        </form>
      </div>
    </dialog>

    <dialog class="ui-sheet" id="genericDialog" aria-labelledby="genericTitle">
      <div class="sheet-head">
        <div><p>LEGACY</p><h2 id="genericTitle">Details</h2></div>
        <form method="dialog"><button class="sheet-close" value="close" aria-label="Close">×</button></form>
      </div>
      <div class="sheet-body" data-generic-body></div>
    </dialog>
  </main>
  <div class="toast" data-toast hidden></div>
  <script src="./geek-state.js"></script>
  <script src="./image-home.js"></script>
</body>
</html>
